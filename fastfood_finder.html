<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>FastFoodFinder</title>
</head>
<body>
    <script>
        const produkte = [
  { name: "Cheeseburger", kette: "McDonald's", kcal: 320, protein: 16, kh: 33, fett: 14 },
  { name: "Big Mac", kette: "McDonald's", kcal: 550, protein: 25, kh: 45, fett: 30 },
  { name: "McChicken", kette: "McDonald's", kcal: 400, protein: 17, kh: 40, fett: 20 },
  { name: "Whopper", kette: "Burger King", kcal: 630, protein: 28, kh: 49, fett: 36 },
  { name: "Chicken Royale", kette: "Burger King", kcal: 500, protein: 22, kh: 44, fett: 26 },
  { name: "Long Chicken", kette: "Burger King", kcal: 460, protein: 24, kh: 42, fett: 22 },
  { name: "Chicken Sub (Footlong)", kette: "Subway", kcal: 620, protein: 40, kh: 70, fett: 16 },
  { name: "Veggie Delite (Footlong)", kette: "Subway", kcal: 380, protein: 15, kh: 60, fett: 6 },
  { name: "Thunfisch Sub (15 cm)", kette: "Subway", kcal: 350, protein: 18, kh: 38, fett: 14 },
  { name: "Original Recipe Chicken Breast", kette: "KFC", kcal: 390, protein: 33, kh: 12, fett: 24 },
  { name: "Zinger Burger", kette: "KFC", kcal: 480, protein: 24, kh: 42, fett: 24 },
  { name: "Hot Wings (3 Stück)", kette: "KFC", kcal: 260, protein: 18, kh: 8, fett: 17 },
  { name: "Bacon Egg Cheese Sandwich", kette: "Dunkin' Donuts", kcal: 470, protein: 21, kh: 38, fett: 26 },
  { name: "Glazed Donut", kette: "Dunkin' Donuts", kcal: 220, protein: 3, kh: 27, fett: 11 },
  { name: "Wrap Chicken Caesar", kette: "Dunkin' Donuts", kcal: 410, protein: 22, kh: 35, fett: 20 },
  { name: "Pommes (mittel)", kette: "McDonald's", kcal: 330, protein: 4, kh: 42, fett: 16 },
  { name: "Cola (0,4 l)", kette: "McDonald's", kcal: 170, protein: 0, kh: 42, fett: 0 },
];
        function passendeProdukte(kalorien, spielraumPlus, spielraumMinus) {
  const zahl = (wert) => {
    if (wert === null || wert === undefined) return NaN;
    if (typeof wert === "string" && wert.trim() === "") return NaN;
    return Number(wert);
  };

  const kcal = zahl(kalorien);
  const plus = zahl(spielraumPlus);
  const minus = zahl(spielraumMinus);

  if (isNaN(kcal) || isNaN(plus) || isNaN(minus)) {
    return "Bitte eine gültige Kalorienzahl eingeben!";
  }

  const kleinsterKcal = Math.min(...produkte.map((p) => p.kcal));
  if (kcal < kleinsterKcal) {
    return "Deine Kalorienzahl ist zu gering!";
  }

  const treffer = produkte.filter(
    (p) => p.kcal >= kcal - minus && p.kcal <= kcal + plus
  );

  if (treffer.length === 0) {
    return "Keine passenden Produkte gefunden, versuche einen größeren Spielraum!";
  }

  return treffer;
}
    </script>
</body>
